seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 32-true
  max_epochs: 50
  log_every_n_steps: 5
  default_root_dir: output/sar_finetuned_50ep
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        filename: best-loss

data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 1
    num_workers: 0
    num_classes: 2
    train_data_root: sen1floods11_v1.1/data/S1GRDHand
    val_data_root: sen1floods11_v1.1/data/S1GRDHand
    test_data_root: sen1floods11_v1.1/data/S1GRDHand
    train_label_data_root: sen1floods11_v1.1/data/LabelHand
    val_label_data_root: sen1floods11_v1.1/data/LabelHand
    test_label_data_root: sen1floods11_v1.1/data/LabelHand
    train_split: sen1floods11_v1.1/splits/flood_train_data.txt
    val_split: sen1floods11_v1.1/splits/flood_valid_data.txt
    test_split: sen1floods11_v1.1/splits/flood_test_data.txt
    img_grep: "*_S1Hand.tif"
    label_grep: "*_LabelHand.tif"
    means: [-12.599, -20.293]
    stds: [5.195, 5.890]
    no_data_replace: 0
    no_label_replace: -1
    train_transform:
      - class_path: albumentations.Resize
        init_args: {height: 256, width: 256}
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2
    val_transform:
      - class_path: albumentations.Resize
        init_args: {height: 256, width: 256}
      - class_path: albumentations.pytorch.transforms.ToTensorV2
    test_transform:
      - class_path: albumentations.Resize
        init_args: {height: 256, width: 256}
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: terramind_v1_tiny
      backbone_pretrained: true
      backbone_modalities: [S1GRD]
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [256, 128, 64, 32]
      num_classes: 2
    loss: dice
    ignore_index: -1
    freeze_backbone: false
    freeze_decoder: false
    plot_on_val: false
    class_names: [Other, Water]

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.00002
